name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # CPU-only torch wheel: the default index pulls CUDA deps that aren't
      # needed on a hosted runner and multiply install time for no benefit.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Unit tests
        run: pytest tests/ -q

      - name: Smoke test (tiny data, 1 epoch, code path only)
        run: |
          python -m greenload.train --smoke-test
          python -m greenload.evaluate --smoke-test

      # The full 25-epoch x 4-signal x 2-mode training run and the full
      # evaluate.py pipeline are NOT run here -- they're a local/manual step
      # whose output (results/) is committed once and referenced by the
      # README, not re-derived on every push. CI's job is regression
      # detection (imports work, shapes match, the solver still solves),
      # not headline-number reproduction.
